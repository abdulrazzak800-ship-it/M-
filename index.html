<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Une petite surprise ❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    padding: 20px;
    text-align: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ffe5ef, #ffc5da, #fff0f5);
}

.card {
    width: 100%;
    max-width: 440px;
    padding: 34px 22px;
    border-radius: 30px;
    background: rgba(255,255,255,.82);
    box-shadow: 0 12px 35px rgba(190,70,120,.18);
    position: relative;
    z-index: 2;
}

.cat {
    font-size: 76px;
    animation: bounce 2s infinite;
}

h1 {
    color: #c52e67;
    font-size: 28px;
}

p {
    color: #9d3d64;
    font-size: 17px;
}

button {
    border: 0;
    border-radius: 16px;
    padding: 14px 28px;
    margin: 10px 7px;
    color: white;
    font-size: 19px;
    font-weight: bold;
    cursor: pointer;
}

.yes {
    background: #62c995;
}

.no {
    background: #f05270;
}

.music {
    background: #c83d83;
    font-size: 15px;
}

.hidden {
    display: none;
}

#no {
    position: relative;
}

#loveMessage {
    color: #c52e67;
    font-size: 23px;
    font-weight: bold;
    line-height: 1.5;
    margin-top: 22px;
    animation: appear .7s;
}

.heart {
    position: fixed;
    bottom: -40px;
    z-index: 1;
    pointer-events: none;
    animation: floatUp 4s linear forwards;
}

@keyframes bounce {
    50% {
        transform: translateY(-10px);
    }
}

@keyframes appear {
    from {
        opacity: 0;
        transform: scale(.65);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

@keyframes floatUp {
    to {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}
</style>
</head>

<body>

<main class="card">

    <div class="cat">🐱💕</div>

    <section id="welcome">
        <h1>J’ai une petite surprise pour toi… 💗</h1>
        <p>Tu veux découvrir ? 🥺</p>
        <button class="yes" onclick="showQuestion()">
            Oui 💕
        </button>
    </section>

    <section id="question" class="hidden">
        <h1>Est-ce que tu m’aimes ? ❤️</h1>
        <p>Réponds sincèrement… 🥺</p>

        <button class="yes" onclick="sayYes()">
            Oui 💗
        </button>

        <button class="no" id="no"
        onmouseenter="runAway()" onclick="runAway()">
            Non 💔
        </button>
    </section>

    <section id="answer" class="hidden">

        <div id="loveMessage">
            Je t’aime aussi mon cœur,
            bichon nouilles 🥺🥺❤️
        </div>

        <p>Un milliard de bisous rien que pour toi ! 💋</p>

        <button class="yes" onclick="moreHearts()">
            Encore des cœurs 💖
        </button>

    </section>

    <button class="music" id="musicButton"
    onclick="toggleMusic()">
        🎵 Écouter la musique
    </button>

    <audio id="song" src="love.mp3" loop></audio>

</main>

<script>

function showQuestion() {
    document.getElementById("welcome").classList.add("hidden");
    document.getElementById("question").classList.remove("hidden");
    createHearts(8);
}

function sayYes() {
    document.getElementById("question").classList.add("hidden");
    document.getElementById("answer").classList.remove("hidden");
    createHearts(45);
}

function runAway() {
    const button = document.getElementById("no");

    button.style.position = "fixed";

    const maxX = window.innerWidth - button.offsetWidth - 20;
    const maxY = window.innerHeight - button.offsetHeight - 20;

    button.style.left = Math.max(10, Math.random() * maxX) + "px";
    button.style.top = Math.max(10, Math.random() * maxY) + "px";
}

function createHearts(amount) {
    const symbols = ["❤️", "💕", "💗", "💖", "🌸", "💘"];

    for (let i = 0; i < amount; i++) {
        setTimeout(() => {
            const heart = document.createElement("span");

            heart.className = "heart";
            heart.textContent =
                symbols[Math.floor(Math.random() * symbols.length)];

            heart.style.left = Math.random() * 100 + "vw";
            heart.style.fontSize = (18 + Math.random() * 22) + "px";

            document.body.appendChild(heart);

            setTimeout(() => heart.remove(), 4100);
        }, i * 65);
    }
}

function moreHearts() {
    createHearts(35);
}

async function toggleMusic() {
    const song = document.getElementById("song");
    const button = document.getElementById("musicButton");

    if (song.paused) {
        try {
            await song.play();
            button.textContent = "⏸️ Mettre en pause";
        } catch (error) {
            alert("Ajoute ton fichier MP3 nommé love.mp3 !");
        }
    } else {
        song.pause();
        button.textContent = "🎵 Écouter la musique";
    }
}

</script>

</body>
</html>
