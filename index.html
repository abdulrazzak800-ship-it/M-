
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Je t'aime ❤️</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: black;
  overflow: hidden;
  height: 100vh;
}

canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

h1 {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: #ff4b96;
  font-family: Arial, sans-serif;
  font-size: clamp(35px, 10vw, 85px);
  font-weight: 900;
  white-space: nowrap;
  text-shadow: 0 0 10px #ff1680,
               0 0 30px #ff1680;
  animation: pulse 1.5s infinite alternate;
}

@keyframes pulse {
  from { opacity: 0.7; }
  to { opacity: 1; }
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>
<h1>JE T’AIME ❤️</h1>

<script>
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

let width, height, drops;
const size = 13;

function resize() {
  canvas.width = width = window.innerWidth;
  canvas.height = height = window.innerHeight;
  drops = Array(Math.floor(width / size)).fill(1);
}

window.addEventListener("resize", resize);
resize();

const letters = "JE T'AIME LOVE ♥ 01";

function draw() {
  ctx.fillStyle = "rgba(0,0,0,0.12)";
  ctx.fillRect(0, 0, width, height);

  ctx.fillStyle = "#ff287f";
  ctx.font = size + "px monospace";

  drops.forEach((y, i) => {
    const letter = letters[
      Math.floor(Math.random() * letters.length)
    ];

    ctx.fillText(letter, i * size, y * size);

    if (y * size > height && Math.random() > 0.97) {
      drops[i] = 0;
    }

    drops[i]++;
  });
}

setInterval(draw, 45);
</script>

</body>
</html>
