```html
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Une question ❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ffe0ec, #ffc1d8, #fff0f5);
    font-family: Arial, sans-serif;
    overflow: hidden;
    text-align: center;
}

.card {
    background: rgba(255,255,255,0.75);
    padding: 35px 20px;
    width: 90%;
    max-width: 420px;
    border-radius: 30px;
    box-shadow: 0 10px 35px #e78aaa55;
    position: relative;
    z-index: 2;
}

.cat {
    font-size: 85px;
    animation: bounce 2s infinite;
}

h1 {
    color: #d6336c;
    font-size: 27px;
}

p {
    color: #a83260;
    font-size: 17px;
}

button {
    border: none;
    padding: 15px 35px;
    margin: 12px;
    border-radius: 15px;
    font-size: 20px;
    font-weight: bold;
    color: white;
    cursor: pointer;
    transition: 0.3s;
}

#yes {
    background: #61c995;
}

#no {
    background: #f05270;
}

#yes:hover {
    transform: scale(1.15);
}

#no {
    position: relative;
}

#result {
    display: none;
    color: #d6336c;
    font-size: 23px;
    font-weight: bold;
    margin-top: 20px;
    animation: appear 1s;
}

.heart {
    position: fixed;
    bottom: -30px;
    font-size: 25px;
    animation: float 4s linear forwards;
    pointer-events: none;
}

.music {
    background: #d63384;
    font-size: 15px;
}

@keyframes float {
    to {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}

@keyframes bounce {
    50% { transform: translateY(-12px); }
}

@keyframes appear {
    from { opacity: 0; transform: scale(0.5); }
    to { opacity: 1; transform: scale(1); }
}
</style>
</head>

<body>

<div class="card">

    <div class="cat">🐱💕</div>

    <h1>Est-ce que tu m'aimes ? ❤️</h1>

    <p>J'ai une petite question pour toi...</p>

    <button id="yes" onclick="sayYes()">Oui 💗</button>

    <button id="no" onmouseover="runAway()" onclick="runAway()">
        Non 💔
    </button>

    <div id="result">
        AAAAAH ! 🥹❤️<br><br>
        Je savais que tu m'aimais ! 💕<br>
        Tu es mon bonheur ! 🌹
        <br><br>
        <button onclick="moreLove()">Encore une surprise 🎁</button>
    </div>

    <button class="music" onclick="playMusic()">
        🎵 Musique
    </button>

</div>

<script>

function sayYes() {
    document.getElementById("result").style.display = "block";
    document.getElementById("no").style.display = "none";

    for(let i = 0; i < 50; i++) {
        setTimeout(createHeart, i * 80);
    }
}

function runAway() {
    const btn = document.getElementById("no");

    btn.style.position = "fixed";

    let x = Math.random() * (window.innerWidth - 100);
    let y = Math.random() * (window.innerHeight - 60);

    btn.style.left = x + "px";
    btn.style.top = y + "px";
}

function createHeart() {
    const heart = document.createElement("div");

    heart.className = "heart";
    heart.innerHTML = ["❤️","💕","💗","💖","🌸"][Math.floor(Math.random()*5)];

    heart.style.left = Math.random() * 100 + "vw";

    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 4000);
}

function moreLove() {
    alert("Je t'aime plus que tout au monde ! ❤️🥹");
}

function playMusic() {
    alert("Ajoute ton fichier musical préféré pour écouter la musique 🎵");
}

</script>

</body>
</html>
```
