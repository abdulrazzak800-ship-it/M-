
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مفاجأة أحمد 😂</title>
<style>
* {box-sizing:border-box}

body {
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#000;
    color:white;
    font-family:Arial,sans-serif;
    overflow:hidden;
}

.container {
    text-align:center;
    z-index:2;
}

h1 {
    color:#ff003c;
    font-size:clamp(30px,8vw,65px);
    text-shadow:0 0 10px red,0 0 30px red,0 0 60px red;
    animation:glow 1.5s infinite alternate;
}

@keyframes glow {
    from {transform:scale(1)}
    to {transform:scale(1.08)}
}

button {
    background:#ff003c;
    color:white;
    border:none;
    border-radius:40px;
    padding:16px 30px;
    font-size:20px;
    cursor:pointer;
    box-shadow:0 0 25px red;
}

button:hover {transform:scale(1.1)}

.emoji {
    position:absolute;
    top:-50px;
    font-size:30px;
    animation:fall linear forwards;
}

@keyframes fall {
    to {transform:translateY(110vh) rotate(720deg)}
}
</style>
</head>
<body>

<div class="container">
    <h1>لفتح طيزك يا أحمد 😂</h1>
    <p>عندك رسالة مهمة يا أحمد 💀</p>
    <button onclick="speak()">🔊 اسمع الرسالة</button>
</div>

<script>
function speak() {
    speechSynthesis.cancel();

    const text = "لفتح طيزك يا أحمد";

    const msg = new SpeechSynthesisUtterance(text);
    msg.lang = "ar-SA";
    msg.rate = 0.75;
    msg.pitch = 1;
    msg.volume = 1;

    const voices = speechSynthesis.getVoices();
    const arabicVoice = voices.find(v =>
        v.lang.toLowerCase().startsWith("ar")
    );

    if (arabicVoice) msg.voice = arabicVoice;

    speechSynthesis.speak(msg);
}

const emojis = ["😂","💀","🤣","🔥"];

setInterval(() => {
    const e = document.createElement("div");
    e.className = "emoji";
    e.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    e.style.left = Math.random()*100+"vw";
    e.style.animationDuration = (3+Math.random()*3)+"s";
    document.body.appendChild(e);
    setTimeout(()=>e.remove(),6000);
},500);

speechSynthesis.onvoiceschanged = () => {};
</script>

</body>
</html>
